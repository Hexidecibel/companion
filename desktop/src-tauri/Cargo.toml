[package]
name = "companion-desktop"
version = "1.0.0"
description = "Companion — desktop & mobile app"
edition = "2021"

[lib]
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-fcm = { path = "plugins/tauri-plugin-fcm" }
tauri-plugin-herald-native = { path = "plugins/tauri-plugin-herald-native" }
tauri-plugin-store = "2"
log = "0.4"

# Desktop-only plugins (tray, menu, window state, autostart)
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
# Herald: system-wide hold-to-talk / toggle / brief shortcuts
tauri-plugin-global-shortcut = "~2.3.2"

# Herald: grant the WebView microphone for our own page (WebKitGTK denies
# getUserMedia unless the app handles permission-request).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Herald floating orb: float over full-screen apps on every Space.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

# Herald: allow the microphone for our own origin in WebView2 without a prompt.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
