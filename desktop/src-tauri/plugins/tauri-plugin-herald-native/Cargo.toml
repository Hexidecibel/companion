[package]
name = "tauri-plugin-herald-native"
version = "0.1.0"
edition = "2021"
description = "Herald native voice glue for the Companion mobile apps: earbud media button, audio focus/ducking"
links = "tauri-plugin-herald-native"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Pairing: browse _companion._tcp on desktop (mobile uses NSD / NWBrowser).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mdns-sd = "0.21"
