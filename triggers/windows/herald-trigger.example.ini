; Copy to herald-trigger.ini (same folder as herald-trigger.ahk) and fill in.
; herald-trigger.ini holds a secret: keep it out of synced / shared folders.
[herald]
; Your daemon's HTTPS address (no trailing slash, no path). At home this works
; for every key: the daemon sees your home IP (via the router) as trusted, so
; listen / toggle may open the mic. From outside your home network or tailnet,
; only brief / stop / repeat / claim work (toggle only stops), by design.
url=https://dev.cush.rocks
; This PC's trigger token (on the server: bin/companion trigger-token create
; gaming-pc). It can only fire Herald triggers; it cannot read sessions or send
; input. Revoke it alone with: bin/companion trigger-token revoke gaming-pc
token=
; Optional: this PC's name in Herald (Herald menu > Devices > Rename this
; device). Set it and every key below acts on THIS PC's browser / app: it is
; made the active device first (kept there unless pin=false). Empty: the keys
; act on whichever device is active.
device=
pin=true
; AutoHotkey key names: ^ Ctrl, ! Alt, + Shift, # Win. Empty = not bound.
toggle_key=^!+h
brief_key=^!+b
listen_key=
stop_key=
repeat_key=
; Just take control (needs device=).
claim_key=
; Give up on a request after this long.
timeout_ms=4000
; Optional: true = never send the token; sign each request instead (refused
; after 60 s or if replayed). Needs this PC's clock to be right.
signed=false
