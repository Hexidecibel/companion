; Copy to herald-trigger.ini (same folder as herald-trigger.ahk) and fill in.
; herald-trigger.ini holds a secret: keep it out of synced / shared folders.
[herald]
; Your daemon's public HTTPS address (no trailing slash, no path).
url=https://dev.cush.rocks
; The trigger token (bin/companion trigger-token create on the server). It can
; only fire Herald triggers; it cannot read sessions or send input.
token=
; AutoHotkey key names: ^ Ctrl, ! Alt, + Shift, # Win. Empty = not bound.
toggle_key=^!+h
brief_key=^!+b
listen_key=
stop_key=
repeat_key=
; Give up on a request after this long.
timeout_ms=4000
